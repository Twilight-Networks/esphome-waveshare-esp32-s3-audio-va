# Second CI build target (.github/workflows/build.yml): the same as
# ci/build.yaml plus the optional Bluetooth proxy (base/ble_proxy.yaml). Core
# and proxy come from the working tree, so the commit under test is what gets
# compiled.
#
#   cp secrets.example.yaml ci/secrets.yaml
#   esphome compile ci/build-ble-proxy.yaml

substitutions:
  name: waveshare-va-ci
  friendly_name: "Waveshare Voice CI"

packages:
  core: !include ../base/core.yaml
  ble_proxy: !include ../base/ble_proxy.yaml
